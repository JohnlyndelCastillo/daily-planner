<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✨Task Monitoring</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#7c3aed" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tasks" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./src/css/style.css">

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { nunito: ['Nunito', 'sans-serif'] },
          boxShadow: {
            soft: '0 2px 12px 0 rgba(0,0,0,0.07)',
            card: '0 4px 24px 0 rgba(0,0,0,0.08)',
          }
        }
      }
    }
  </script>

</head>

<body class="min-h-screen bg-gradient-to-br from-pink-50 via-fuchsia-50 to-violet-100 p-4 sm:p-8 font-nunito">

  <div class="max-w-lg mx-auto">

    <!-- Header -->
    <div class="text-center mb-6">
      <div class="text-5xl mb-2 select-none">🌸</div>
      <h1 class="text-2xl font-extrabold text-violet-700">Daily Task Monitoring</h1>
      <p id="dateLabel" class="text-xs font-bold text-violet-400 mt-1 tracking-wide uppercase"></p>
    </div>

    <!-- Input Card -->
    <div class="bg-white/80 backdrop-blur-sm rounded-3xl shadow-card border border-pink-100 p-4 mb-4">
      <textarea id="taskInput" rows="1" placeholder="What's on your plate today? 🍱"
        class="w-full text-sm resize-none font-semibold text-gray-700 placeholder-pink-300 bg-pink-50 rounded-2xl px-4 py-3 border-0 focus:outline-none focus:ring-2 focus:ring-pink-300 transition-all min-h-[44px]"></textarea>

      <div class="flex items-center justify-between mt-3 px-1">
        <span class="text-xs text-violet-300 font-bold select-none"></span>
        <button id="addBtn"
          class="btn-pill bg-gradient-to-r from-pink-400 to-violet-500 text-white text-sm font-extrabold px-5 py-2 rounded-full shadow-soft hover:brightness-110">
          + Add ✨
        </button>
      </div>
    </div>

    <!-- Task List -->
    <div class="bg-white/80 backdrop-blur-sm rounded-3xl shadow-card border border-violet-100 overflow-hidden">

      <div class="flex items-center justify-between px-5 py-3 border-b border-violet-50">
        <div class="flex items-center gap-2">
          <span class="text-lg select-none">📋</span>
          <span class="font-extrabold text-violet-700 text-sm">Today's tasks</span>
          <span onclick="document.getElementById('tooltipBox').classList.toggle('hidden')"
            class="text-xs font-extrabold text-violet-300 bg-violet-50 border border-violet-200 rounded-full w-4 h-4 flex items-center justify-center cursor-pointer select-none">?</span>
        </div>
        <span id="taskCount" class="text-xs font-extrabold text-violet-400 bg-violet-50 px-3 py-1 rounded-full"></span>
      </div>

      <!-- Tooltip row — sits below header, pushes tasks down -->
      <div id="tooltipBox" class="hidden border-b border-violet-50 bg-violet-50/50 px-5 py-3 space-y-2">
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs font-extrabold text-violet-400 uppercase tracking-wide">Quick Guide</span>
          <button onclick="document.getElementById('tooltipBox').classList.add('hidden')"
            class="text-xs font-extrabold text-violet-300 hover:text-violet-500">✕</button>
        </div>
        <div class="flex items-start gap-2">
          <span class="text-base">✏️</span>
          <p class="text-xs font-semibold text-gray-600"><span class="font-extrabold text-violet-600">Edit</span> —
            Double click/tap the task text to edit. Only available for 🌿 To Do and ⚡ Doing tasks.</p>
        </div>
        <div class="flex items-start gap-2">
          <span class="text-base">↩️</span>
          <p class="text-xs font-semibold text-gray-600"><span class="font-extrabold text-violet-600">Carry over</span>
            — Unfinished tasks from past days appear in a banner on app load.</p>
        </div>
      </div>

      <ul id="taskList" class="divide-y divide-violet-50"></ul>
    </div>

    <p class="text-center text-xs font-bold text-violet-300 mt-5 select-none">
      Unfinished tasks are carried over the next day 🌙
    </p>

  </div>

  <script type="module" src="./src/js/main.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(reg => console.log('Service worker registered:', reg.scope))
          .catch(err => console.error('Service worker registration failed:', err));
      });
    }
  </script>

  <script>
    document.addEventListener('click', (e) => {
      const wrapper = document.getElementById('tooltipWrapper');
      const box = document.getElementById('tooltipBox');
      if (wrapper && !wrapper.contains(e.target)) {
        box.classList.add('hidden');
      }
    });
  </script>

</body>

</html>
